var currentView = 'pipeline';
var currentFilter = 'All';
var currentSearch = '';

function scoreColor(s) {
  if (s >= 60) return '#10b981';
  if (s >= 40) return '#f59e0b';
  if (s >= 25) return '#f97316';
  return '#ef4444';
}

function showView(v) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  var navEl = document.getElementById('nav-' + v);
  if (navEl) navEl.classList.add('active');
  renderContent();
  document.getElementById('content').scrollTop = 0;
}

function renderContent() {
  if (currentView === 'pipeline') renderPipeline();
  else if (currentView === 'tasks') renderTasks();
  else if (currentView === 'stats') renderStats();
}

function renderPipeline() {
  var counts = {};
  LEADS.forEach(l => { counts[l.status] = (counts[l.status]||0)+1; });
  var total = LEADS.length;
  document.getElementById('h-sub').textContent = 'Cape Coral · ' + total + ' leads';
  
  var html = '<div class="stats-row">';
  html += '<div class="stat-card"><div class="stat-num" style="color:#6366f1">' + (counts.New||0) + '</div><div class="stat-lbl">New</div></div>';
  html += '<div class="stat-card"><div class="stat-num" style="color:#f59e0b">' + (counts.Contacted||0) + '</div><div class="stat-lbl">Contacted</div></div>';
  html += '<div class="stat-card"><div class="stat-num" style="color:#10b981">' + (counts.Engaged||0) + '</div><div class="stat-lbl">Engaged</div></div>';
  html += '</div>';
  
  html += '<div class="filter-row">';
  ['All','New','Contacted'].forEach(f => {
    var cnt = f === 'All' ? total : (counts[f]||0);
    var active = currentFilter === f ? ' active' : '';
    html += '<div class="f-tab' + active + '" onclick="setFilter(\'' + f + '\')">' + f + ' (' + cnt + ')</div>';
  });
  html += '</div>';
  
  var filtered = LEADS.filter(l => currentFilter === 'All' || l.status === currentFilter);
  html += '<div class="cards">';
  if (filtered.length === 0) {
    html += '<div class="empty"><div>🔍</div>No leads found.</div>';
  } else {
    filtered.forEach(l => {
      var sc = scoreColor(l.score_overall);
      html += '<div class="card"><div class="card-top"><div class="card-name">' + (l.full_name||'Unknown') + '</div>';
      html += '<div class="score-dot" style="background:' + sc + '">' + (l.score_overall||0) + '</div></div>';
      html += '<div class="card-addr">' + (l.property_address||'') + ' · ' + (l.unit_count||0) + ' units</div>';
      html += '</div>';
    });
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  renderPipeline();
}

function renderTasks() {
  document.getElementById('h-sub').textContent = 'Follow-up Queue';
  var upcoming = LEADS.filter(l => l.next_followup_date && l.status === 'Contacted').sort((a,b) => (a.next_followup_date||'').localeCompare(b.next_followup_date||''));
  
  var html = '<div style="padding:16px 16px 32px">';
  html += '<div class="divider-lbl">Upcoming Follow-ups (' + upcoming.length + ')</div>';
  if (upcoming.length === 0) {
    html += '<div class="empty"><div>✅</div>No pending tasks.</div>';
  } else {
    upcoming.forEach(l => {
      html += '<div class="stat-big"><div style="font-size:14px;font-weight:600;color:#f1f5f9">' + (l.full_name||'Unknown') + '</div><div style="font-size:12px;color:#6b7280;margin-top:8px">📅 ' + l.next_followup_date + '</div></div>';
    });
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderStats() {
  document.getElementById('h-sub').textContent = 'Campaign Overview';
  var counts = {};
  LEADS.forEach(l => { counts[l.status] = (counts[l.status]||0)+1; });
  var avgScore = Math.round(LEADS.reduce((a,l) => a+(l.score_overall||0), 0) / LEADS.length);
  
  var html = '<div class="stats-grid">';
  html += '<div class="stat-big"><div class="stat-big-num" style="color:#6366f1">' + LEADS.length + '</div><div class="stat-big-lbl">Total</div></div>';
  html += '<div class="stat-big"><div class="stat-big-num" style="color:#f59e0b">' + (counts.Contacted||0) + '</div><div class="stat-big-lbl">Contacted</div></div>';
  html += '<div class="stat-big"><div class="stat-big-num" style="color:#10b981">' + (counts.New||0) + '</div><div class="stat-big-lbl">New</div></div>';
  html += '<div class="stat-big"><div class="stat-big-num" style="color:#8b5cf6">' + avgScore + '</div><div class="stat-big-lbl">Avg Score</div></div>';
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

renderContent();
