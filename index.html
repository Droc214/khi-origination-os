<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;height:-webkit-fill-available}body{height:100%;height:-webkit-fill-available;overflow:hidden;background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;position:relative}
#header{background:#1a1d27;border-bottom:1px solid #2a2d3a;padding:12px 16px;flex-shrink:0;z-index:10}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{background:#1a1d27;border-top:1px solid #2a2d3a;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;font-size:10px;color:#6b7280;gap:3px;cursor:pointer;user-select:none;background:none;border:none;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:#6366f1}
.nav-icon{font-size:22px;line-height:1}
.h-title{font-size:16px;font-weight:700;color:#fff}
.h-sub{font-size:11px;color:#6b7280;margin-top:2px}
/* Stats row */
.stats-row{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stats-row::-webkit-scrollbar{display:none}
.stat-card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:10px;padding:10px 14px;min-width:72px;text-align:center;flex-shrink:0}
.stat-num{font-size:22px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;color:#6b7280;margin-top:3px;text-transform:uppercase}
/* Filter tabs */
.filter-row{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.f-tab{background:#1a1d27;border:1px solid #2a2d3a;border-radius:20px;padding:6px 13px;font-size:12px;color:#9ca3af;white-space:nowrap;flex-shrink:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.f-tab.active{background:#6366f1;border-color:#6366f1;color:#fff;font-weight:600}
/* Cards */
.cards{padding:0 16px 32px}
.lead-card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:rgba(99,102,241,0.15);position:relative}
.lead-card:active{border-color:#6366f1;background:#1e2235}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.card-name{font-size:15px;font-weight:600;color:#f1f5f9;flex:1;padding-right:8px;line-height:1.3}
.score-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.pill{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px}
.tag{background:#1e2235;border:1px solid #2a2d3a;border-radius:4px;padding:2px 7px;font-size:10px;color:#9ca3af}
.card-addr{font-size:12px;color:#6b7280}
/* Detail panel - slides in from right */
#detail-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1117;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:100;transform:translateX(100%);transition:transform 0.25s cubic-bezier(.4,0,.2,1);will-change:transform}
#detail-panel.open{transform:translateX(0)}
.d-hdr{background:#1a1d27;border-bottom:1px solid #2a2d3a;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.back-btn{background:none;border:none;color:#6366f1;font-size:15px;font-weight:600;padding:6px 10px 6px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.d-name{flex:1;font-size:15px;font-weight:700;color:#f1f5f9;line-height:1.3}
.d-score-block{text-align:center;padding:28px 16px 16px}
.big-score{font-size:60px;font-weight:800;line-height:1}
.big-lbl{font-size:12px;color:#6b7280;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
/* Score bars */
.bars{padding:8px 16px 20px;display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;color:#9ca3af}
.bar-lbl{width:88px;flex-shrink:0}
.bar-track{flex:1;height:8px;background:#1e2235;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-val{width:26px;text-align:right;flex-shrink:0;font-weight:600}
/* Detail grid */
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#2a2d3a;margin:0 0 8px;border-top:1px solid #2a2d3a;border-bottom:1px solid #2a2d3a}
.d-cell{background:#0f1117;padding:12px 14px}
.cell-lbl{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cell-val{font-size:13px;color:#e5e7eb}
.d-section{margin:0 16px 32px;background:#1a1d27;border:1px solid #2a2d3a;border-radius:10px;padding:14px}
.d-section-lbl{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
/* Tasks */
.task-card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:12px;padding:14px;margin-bottom:10px}
.task-name{font-size:14px;font-weight:600;color:#f1f5f9;margin-bottom:5px}
.task-meta{font-size:12px;color:#6b7280}
/* Stats page */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.stat-big{background:#1a1d27;border:1px solid #2a2d3a;border-radius:12px;padding:18px;text-align:center}
.stat-big-num{font-size:38px;font-weight:800}
.stat-big-lbl{font-size:11px;color:#6b7280;margin-top:4px;text-transform:uppercase}
.div-lbl{padding:8px 16px 6px;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.empty{text-align:center;padding:60px 20px;color:#6b7280;font-size:14px}
</style>
</head>

var currentView = 'pipeline';
var currentFilter = 'All';

function sc(s){ return s>=60?'#10b981':s>=40?'#f59e0b':s>=25?'#f97316':'#ef4444'; }
function stc(s){ return {New:'#6366f1',Contacted:'#f59e0b',Engaged:'#10b981',Bounced:'#ef4444'}[s]||'#6b7280'; }

function showView(v) {
  currentView = v;
  ['pipeline','tasks','stats'].forEach(function(x){
    document.getElementById('nb-'+x).classList.toggle('active', x===v);
  });
  render();
  document.getElementById('content').scrollTop = 0;
}

function render() {
  if (currentView==='pipeline') renderPipeline();
  else if (currentView==='tasks') renderTasks();
  else renderStats();
}

function renderPipeline() {
  document.getElementById('h-sub').textContent = 'Cape Coral Pipeline';
  var counts = {};
  LEADS.forEach(function(l){ counts[l.status]=(counts[l.status]||0)+1; });

  var h = '<div class="stats-row">';
  h += '<div class="stat-card"><div class="stat-num" style="color:#6366f1">'+(counts.New||0)+'</div><div class="stat-lbl">New</div></div>';
  h += '<div class="stat-card"><div class="stat-num" style="color:#f59e0b">'+(counts.Contacted||0)+'</div><div class="stat-lbl">Contacted</div></div>';
  h += '<div class="stat-card"><div class="stat-num" style="color:#10b981">'+(counts.Engaged||0)+'</div><div class="stat-lbl">Engaged</div></div>';
  h += '<div class="stat-card"><div class="stat-num" style="color:#ef4444">'+(counts.Bounced||0)+'</div><div class="stat-lbl">Bounced</div></div>';
  h += '</div>';

  h += '<div class="filter-row">';
  ['All','New','Contacted','Engaged','Bounced'].forEach(function(f){
    var cnt = f==='All' ? LEADS.length : (counts[f]||0);
    h += '<div class="f-tab'+(currentFilter===f?' active':'')+'" onclick="setFilter(''+f+'')">'+f+' ('+cnt+')</div>';
  });
  h += '</div>';

  var list = currentFilter==='All' ? LEADS : LEADS.filter(function(l){return l.status===currentFilter;});
  h += '<div class="cards">';
  if (!list.length) {
    h += '<div class="empty">No leads in this category.</div>';
  } else {
    list.forEach(function(l) {
      var c = sc(l.score_overall), s = stc(l.status);
      h += '<div class="lead-card" data-id="'+l.id+'">';
      h += '<div class="card-top">';
      h += '<div class="card-name">'+(l.full_name||'Unknown')+'</div>';
      h += '<div class="score-dot" style="background:'+c+'">'+l.score_overall+'</div>';
      h += '</div>';
      h += '<div class="card-tags">';
      h += '<span class="pill" style="background:'+s+'22;color:'+s+'">'+l.status+'</span>';
      h += '<span class="tag">'+l.owner_type+'</span>';
      if (l.is_absentee) h += '<span class="tag" style="color:#fbbf24;border-color:#f59e0b55">Absentee</span>';
      h += '</div>';
      h += '<div class="card-addr">'+(l.property_address||'')+'&nbsp;&middot;&nbsp;'+l.unit_count+' units</div>';
      h += '</div>';
    });
  }
  h += '</div>';
  document.getElementById('content').innerHTML = h;

  // Attach touch listeners to cards
  document.querySelectorAll('.lead-card').forEach(function(card) {
    card.addEventListener('click', function() {
      openDetail(card.getAttribute('data-id'));
    });
  });
}

function setFilter(f) {
  currentFilter = f;
  renderPipeline();
}

function openDetail(id) {
  var l = LEADS.find(function(x){ return x.id === id; });
  if (!l) return;
  var c = sc(l.score_overall), s = stc(l.status);

  var h = '<div class="d-hdr">';
  h += '<button class="back-btn" onclick="closeDetail()">&#8592; Back</button>';
  h += '<div class="d-name">'+(l.full_name||'Unknown')+'</div>';
  h += '</div>';

  h += '<div class="d-score-block">';
  h += '<div class="big-score" style="color:'+c+'">'+l.score_overall+'</div>';
  h += '<div class="big-lbl">Overall Score</div>';
  h += '</div>';

  h += '<div class="bars">';
  [['PM Score',l.score_pm,'#6366f1'],['Construction',l.score_construction,'#f59e0b'],['Cap Markets',l.score_capital_markets,'#10b981'],['Relationship',l.score_relationship,'#8b5cf6']].forEach(function(r){
    h += '<div class="bar-row"><span class="bar-lbl">'+r[0]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.min(r[1]||0,100)+'%;background:'+r[2]+'"></div></div><span class="bar-val">'+r[1]+'</span></div>';
  });
  h += '</div>';

  h += '<div class="d-grid">';
  var fields = [
    ['Status','<span class="pill" style="background:'+s+'22;color:'+s+'">'+l.status+'</span>'],
    ['Owner Type', l.owner_type||'—'],
    ['Units', l.unit_count||'—'],
    ['Absentee', l.is_absentee?'Yes':'No'],
    ['City', l.property_city||'—'],
    ['Sequence', (l.sequence||'—').replace('Sequence ','Seq ')],
    ['Emails Sent', l.emails_sent_count||0],
    ['Next Follow-up', l.next_followup_date||'—']
  ];
  fields.forEach(function(f){
    h += '<div class="d-cell"><div class="cell-lbl">'+f[0]+'</div><div class="cell-val">'+f[1]+'</div></div>';
  });
  h += '</div>';

  h += '<div class="d-section">';
  h += '<div class="d-section-lbl">Contact</div>';
  h += '<div style="font-size:13px;color:#e5e7eb;margin-bottom:8px">&#128231; '+(l.email||'No email')+'</div>';
  h += '<div style="font-size:13px;color:#9ca3af">&#128205; '+(l.property_address||'—')+', Cape Coral, FL</div>';
  if (l.bounce_reason) h += '<div style="font-size:12px;color:#ef4444;margin-top:8px">&#9888;&#65039; Bounce: '+l.bounce_reason+'</div>';
  h += '</div>';

  var panel = document.getElementById('detail-panel');
  panel.innerHTML = h;
  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function renderTasks() {
  document.getElementById('h-sub').textContent = 'Follow-up Queue';
  var upcoming = LEADS.filter(function(l){ return l.status==='Contacted' && l.next_followup_date; });
  upcoming.sort(function(a,b){ return (a.next_followup_date||'').localeCompare(b.next_followup_date||''); });

  var h = '<div style="padding:8px 0 32px">';
  h += '<div class="div-lbl">Follow-ups ('+upcoming.length+')</div>';
  if (!upcoming.length) {
    h += '<div class="empty">No pending follow-ups.</div>';
  } else {
    h += '<div style="padding:8px 16px 0">';
    upcoming.forEach(function(l){
      var over = l.next_followup_date < '2026-05-19';
      h += '<div class="task-card">';
      h += '<div class="task-name">'+(l.full_name||'Unknown')+'</div>';
      h += '<div class="task-meta">'+(over?'<span style="color:#ef4444">&#9888;&#65039; Overdue</span>':'<span style="color:#f59e0b">&#128197;</span>')+' '+l.next_followup_date+'</div>';
      h += '<div class="task-meta" style="margin-top:4px">'+l.sequence+' &middot; '+l.emails_sent_count+' sent</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('content').innerHTML = h;
}

function renderStats() {
  document.getElementById('h-sub').textContent = 'Campaign Overview';
  var counts = {};
  LEADS.forEach(function(l){ counts[l.status]=(counts[l.status]||0)+1; });
  var emailed = LEADS.filter(function(l){return l.emails_sent_count>0;}).length;
  var avg = Math.round(LEADS.reduce(function(a,l){return a+(l.score_overall||0);},0)/LEADS.length);
  var abs = LEADS.filter(function(l){return l.is_absentee;}).length;

  var h = '<div class="stats-grid">';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#6366f1">'+LEADS.length+'</div><div class="stat-big-lbl">Total Leads</div></div>';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#f59e0b">'+emailed+'</div><div class="stat-big-lbl">Emailed</div></div>';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#10b981">'+(counts.Engaged||0)+'</div><div class="stat-big-lbl">Engaged</div></div>';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#8b5cf6">'+avg+'</div><div class="stat-big-lbl">Avg Score</div></div>';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#06b6d4">'+abs+'</div><div class="stat-big-lbl">Absentee</div></div>';
  h += '<div class="stat-big"><div class="stat-big-num" style="color:#ef4444">'+(counts.Bounced||0)+'</div><div class="stat-big-lbl">Bounced</div></div>';
  h += '</div>';

  var seq = {};
  LEADS.forEach(function(l){ var s=(l.sequence||'Unknown'); seq[s]=(seq[s]||0)+1; });
  h += '<div class="div-lbl">By Sequence</div>';
  h += '<div style="padding:8px 16px 32px">';
  Object.keys(seq).forEach(function(s){
    var p = Math.round(seq[s]/LEADS.length*100);
    h += '<div style="margin-bottom:12px">';
    h += '<div style="display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-bottom:5px"><span>'+s+'</span><span>'+seq[s]+' ('+p+'%)</span></div>';
    h += '<div style="height:7px;background:#1e2235;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:#6366f1;border-radius:4px"></div></div>';
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('content').innerHTML = h;
}

// Init
document.addEventListener("DOMContentLoaded", function(){ render(); });
</script>
</body>
</html>
