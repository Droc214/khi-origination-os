var view = 'p';
var filter = 'All';

function sc(s) { return s >= 60 ? '#10b981' : s >= 40 ? '#f59e0b' : s >= 25 ? '#f97316' : '#ef4444'; }
function stc(s) { var m = {New:'#6366f1',Contacted:'#f59e0b',Engaged:'#10b981',Bounced:'#ef4444'}; return m[s] || '#6b7280'; }

function setView(v) {
  view = v;
  document.getElementById('nb-p').className = 'nb' + (v==='p'?' on':'');
  document.getElementById('nb-t').className = 'nb' + (v==='t'?' on':'');
  document.getElementById('nb-s').className = 'nb' + (v==='s'?' on':'');
  document.getElementById('hdr-sub').textContent = v==='p' ? 'Cape Coral Pipeline' : v==='t' ? 'Follow-up Queue' : 'Campaign Overview';
  draw();
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('nb-p').addEventListener('click', function() { setView('p'); });
document.getElementById('nb-t').addEventListener('click', function() { setView('t'); });
document.getElementById('nb-s').addEventListener('click', function() { setView('s'); });

function draw() {
  if (view === 'p') drawPipeline();
  else if (view === 't') drawTasks();
  else drawStats();
}

function drawPipeline() {
  var counts = {};
  for (var i = 0; i < LEADS.length; i++) { var st = LEADS[i].status; counts[st] = (counts[st]||0)+1; }
  var h = '';
  h += '<div class="stats-row">';
  h += '<div class="sc"><div class="sc-n" style="color:#6366f1">'+(counts.New||0)+'</div><div class="sc-l">New</div></div>';
  h += '<div class="sc"><div class="sc-n" style="color:#f59e0b">'+(counts.Contacted||0)+'</div><div class="sc-l">Contacted</div></div>';
  h += '<div class="sc"><div class="sc-n" style="color:#10b981">'+(counts.Engaged||0)+'</div><div class="sc-l">Engaged</div></div>';
  h += '<div class="sc"><div class="sc-n" style="color:#ef4444">'+(counts.Bounced||0)+'</div><div class="sc-l">Bounced</div></div>';
  h += '</div>';
  h += '<div class="ftabs">';
  var filters = ['All','New','Contacted','Engaged','Bounced'];
  for (var fi = 0; fi < filters.length; fi++) {
    var f = filters[fi];
    var cnt = f === 'All' ? LEADS.length : (counts[f]||0);
    h += '<div class="ft' + (filter===f?' on':'') + '" data-f="'+f+'">'+f+' ('+cnt+')</div>';
  }
  h += '</div>';
  var list = [];
  for (var i = 0; i < LEADS.length; i++) { if (filter === 'All' || LEADS[i].status === filter) list.push(LEADS[i]); }
  h += '<div class="cards">';
  if (list.length === 0) {
    h += '<div class="empty">No leads in this category.</div>';
  } else {
    for (var i = 0; i < list.length; i++) {
      var l = list[i];
      var c = sc(l.score_overall||0), s = stc(l.status);
      h += '<div class="lc" data-id="'+l.id+'">';
      h += '<div class="lc-top"><div class="lc-name">'+(l.full_name||'Unknown')+'</div>';
      h += '<div class="sdot" style="background:'+c+'">'+(l.score_overall||0)+'</div></div>';
      h += '<div class="tags">';
      h += '<span class="pill" style="background:'+s+'33;color:'+s+'">'+l.status+'</span>';
      h += '<span class="tag">'+(l.owner_type||'')+'</span>';
      if (l.is_absentee) h += '<span class="tag" style="color:#fbbf24;border-color:#f59e0b55">Absentee</span>';
      h += '</div>';
      h += '<div class="lc-addr">'+(l.property_address||'')+'</div>';
      h += '</div>';
    }
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
  var ftabs = document.querySelectorAll('.ft');
  for (var i = 0; i < ftabs.length; i++) {
    ftabs[i].addEventListener('click', function() { filter = this.getAttribute('data-f'); drawPipeline(); });
  }
  var cards = document.querySelectorAll('.lc');
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function() { openDetail(this.getAttribute('data-id')); });
  }
}

function openDetail(id) {
  var l = null;
  for (var i = 0; i < LEADS.length; i++) { if (LEADS[i].id === id) { l = LEADS[i]; break; } }
  if (!l) return;
  var c = sc(l.score_overall||0), s = stc(l.status);
  var h = '';
  h += '<div class="det-hdr"><button class="back" id="back-btn">&#8592; Back</button><div class="det-name">'+(l.full_name||'Unknown')+'</div></div>';
  h += '<div class="big-sc"><div class="big-n" style="color:'+c+'">'+(l.score_overall||0)+'</div><div class="big-l">Overall Score</div></div>';
  h += '<div class="bars">';
  var bdata = [['PM Score',l.score_pm,'#6366f1'],['Construction',l.score_construction,'#f59e0b'],['Cap Markets',l.score_capital_markets,'#10b981'],['Relationship',l.score_relationship,'#8b5cf6']];
  for (var i = 0; i < bdata.length; i++) {
    var b = bdata[i]; var w = Math.min(b[1]||0, 100);
    h += '<div class="br"><span class="br-l">'+b[0]+'</span><div class="br-t"><div class="br-f" style="width:'+w+'%;background:'+b[2]+'"></div></div><span class="br-v">'+b[1]+'</span></div>';
  }
  h += '</div>';
  h += '<div class="dgrid">';
  var fields = [['Status','<span class="pill" style="background:'+s+'33;color:'+s+'">'+l.status+'</span>'],['Owner Type',l.owner_type||'&mdash;'],['Units',l.unit_count||'&mdash;'],['Absentee',l.is_absentee?'Yes':'No'],['City',l.property_city||'&mdash;'],['Sequence',(l.sequence||'&mdash;')],['Emails Sent',l.emails_sent_count||0],['Next Follow-up',l.next_followup_date||'&mdash;']];
  for (var i = 0; i < fields.length; i++) {
    h += '<div class="dc"><div class="dc-l">'+fields[i][0]+'</div><div class="dc-v">'+fields[i][1]+'</div></div>';
  }
  h += '</div>';
  h += '<div class="dsec"><div class="dsec-l">Contact</div>';
  h += '<div style="font-size:13px;color:#e5e7eb;margin-bottom:8px">&#128231; '+(l.email||'No email')+'</div>';
  h += '<div style="font-size:13px;color:#9ca3af">&#128205; '+(l.property_address||'&mdash;')+', Cape Coral, FL</div>';
  if (l.bounce_reason) h += '<div style="font-size:12px;color:#ef4444;margin-top:8px">&#9888; Bounce: '+l.bounce_reason+'</div>';
  h += '</div>';
  var det = document.getElementById('det');
  det.innerHTML = h;
  det.style.display = 'block';
  det.scrollTop = 0;
  document.getElementById('back-btn').addEventListener('click', function() {
    document.getElementById('det').style.display = 'none';
  });
}

function drawTasks() {
  var upcoming = [];
  for (var i = 0; i < LEADS.length; i++) { if (LEADS[i].status === 'Contacted' && LEADS[i].next_followup_date) upcoming.push(LEADS[i]); }
  upcoming.sort(function(a,b) { return (a.next_followup_date||'').localeCompare(b.next_followup_date||''); });
  var h = '<div style="padding:8px 0 32px">';
  h += '<div class="divlbl">Follow-ups ('+upcoming.length+')</div>';
  if (!upcoming.length) {
    h += '<div class="empty">No pending follow-ups.</div>';
  } else {
    h += '<div style="padding:8px 16px 0">';
    for (var i = 0; i < upcoming.length; i++) {
      var l = upcoming[i];
      h += '<div class="tc"><div class="tc-n">'+(l.full_name||'Unknown')+'</div>';
      h += '<div class="tc-m">&#128197; '+l.next_followup_date+'</div>';
      h += '<div class="tc-m" style="margin-top:4px">'+(l.sequence||'')+'</div></div>';
    }
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
}

function drawStats() {
  var counts = {};
  for (var i = 0; i < LEADS.length; i++) { var st = LEADS[i].status; counts[st]=(counts[st]||0)+1; }
  var emailed = 0, scoreSum = 0, abs = 0;
  for (var i = 0; i < LEADS.length; i++) {
    if (LEADS[i].emails_sent_count > 0) emailed++;
    scoreSum += (LEADS[i].score_overall||0);
    if (LEADS[i].is_absentee) abs++;
  }
  var avg = Math.round(scoreSum / LEADS.length);
  var h = '<div class="sgrid">';
  h += '<div class="sb"><div class="sb-n" style="color:#6366f1">'+LEADS.length+'</div><div class="sb-l">Total Leads</div></div>';
  h += '<div class="sb"><div class="sb-n" style="color:#f59e0b">'+emailed+'</div><div class="sb-l">Emailed</div></div>';
  h += '<div class="sb"><div class="sb-n" style="color:#10b981">'+(counts.Engaged||0)+'</div><div class="sb-l">Engaged</div></div>';
  h += '<div class="sb"><div class="sb-n" style="color:#8b5cf6">'+avg+'</div><div class="sb-l">Avg Score</div></div>';
  h += '<div class="sb"><div class="sb-n" style="color:#06b6d4">'+abs+'</div><div class="sb-l">Absentee</div></div>';
  h += '<div class="sb"><div class="sb-n" style="color:#ef4444">'+(counts.Bounced||0)+'</div><div class="sb-l">Bounced</div></div>';
  h += '</div>';
  var seq = {};
  for (var i = 0; i < LEADS.length; i++) { var s = LEADS[i].sequence||'Unknown'; seq[s]=(seq[s]||0)+1; }
  h += '<div class="divlbl">By Sequence</div><div style="padding:8px 16px 32px">';
  for (var s in seq) {
    var p = Math.round(seq[s]/LEADS.length*100);
    h += '<div style="margin-bottom:12px">';
    h += '<div style="display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-bottom:5px"><span>'+s+'</span><span>'+seq[s]+' ('+p+'%)</span></div>';
    h += '<div style="height:7px;background:#1e2235;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:#6366f1;border-radius:4px"></div></div>';
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
}

// Boot
draw();
</script>
</body>
</html>
