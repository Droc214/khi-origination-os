<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHI Origination OS — Stats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;border-bottom:1px solid #334155;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;color:#fff}.logo span{color:#3b82f6}
.updated{font-size:12px;color:#64748b}
.nav{background:#1e293b;padding:0 24px;display:flex;border-bottom:1px solid #334155}
.nav a{padding:12px 20px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;border-bottom:2px solid transparent}
.nav a.active{color:#3b82f6;border-bottom-color:#3b82f6}
.nav a:hover{color:#e2e8f0}
.content{padding:24px;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
.label{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.value{font-size:36px;font-weight:700;color:#fff}
.bar-section{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:16px}
.bar-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:120px;font-size:13px;color:#94a3b8}
.bar-track{flex:1;background:#0f172a;border-radius:4px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;padding-left:8px;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center}
.bar-count{width:40px;text-align:right;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div class="logo">KHI <span>Origination OS</span></div>
  <div class="updated">Last updated: 05/25/2026 11:43 PM</div>
</div>
<nav class="nav">
  <a href="index.html">Pipeline</a>
  <a href="tasks.html">Tasks</a>
  <a href="stats.html" class="active">Stats</a>
</nav>
<div class="content">
  <div class="grid">
    <div class="card"><div class="label">Total Pipeline</div><div class="value">802</div></div>
    <div class="card"><div class="label">Emails Sent</div><div class="value" style="color:#3b82f6">890</div></div>
    <div class="card"><div class="label">Engaged</div><div class="value" style="color:#10b981">1</div></div>
  </div>
  <div class="bar-section">
    <h3>Pipeline by Status</h3>
    <div class="bar-row"><div class="bar-label">Contacted</div><div class="bar-track"><div class="bar-fill" style="width:99%;background:#f59e0b">99%</div></div><div class="bar-count">796</div></div>
<div class="bar-row"><div class="bar-label">New</div><div class="bar-track"><div class="bar-fill" style="width:0%;background:#6b7280">0%</div></div><div class="bar-count">3</div></div>
<div class="bar-row"><div class="bar-label">Terminated</div><div class="bar-track"><div class="bar-fill" style="width:0%;background:#dc2626">0%</div></div><div class="bar-count">1</div></div>
<div class="bar-row"><div class="bar-label">Engaged</div><div class="bar-track"><div class="bar-fill" style="width:0%;background:#10b981">0%</div></div><div class="bar-count">1</div></div>
<div class="bar-row"><div class="bar-label">Bounced</div><div class="bar-track"><div class="bar-fill" style="width:0%;background:#ef4444">0%</div></div><div class="bar-count">1</div></div>

  </div>
</div>
</body></html>
