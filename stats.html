<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - KHI Origination OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 2rem; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .nav { background: #fff; border-bottom: 1px solid #ddd; padding: 1rem 2rem; display: flex; gap: 2rem; }
        .nav a { text-decoration: none; color: #333; font-weight: 500; }
        .nav a:hover { color: #1a1a2e; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 1rem; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #1a1a2e; margin-bottom: 0.5rem; }
        .stat-card .breakdown { font-size: 0.85rem; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>KHI Origination OS</h1>
        <p>Statistics & Analytics</p>
    </div>
    <div class="nav">
        <a href="index.html">Pipeline</a>
        <a href="stats.html">Statistics</a>
        <a href="tasks.html">Tasks</a>
    </div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <div class="value">702</div>
                <div class="breakdown">All contacted prospects</div>
            </div>
            <div class="stat-card">
                <h3>By Sequence</h3>
                <div class="breakdown">
                    A (Individual): 406<br>
                    B (LLC): 165<br>
                    C (Absentee): 131
                </div>
            </div>
            <div class="stat-card">
                <h3>Status Distribution</h3>
                <div class="breakdown">
                    Contacted: 697<br>
                    Engaged: 1
                </div>
            </div>
        </div>
    </div>
</body>
</html>
